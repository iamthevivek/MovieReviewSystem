<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Movie Review System — Live Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: #131b2e;
      --card-border: #1e293b;
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #f59e0b;
      --success: #10b981;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background-color: var(--bg); color: var(--text); min-height: 100vh; padding: 30px 20px; }
    .container { max-width: 1200px; margin: 0 auto; }
    
    header { text-align: center; margin-bottom: 40px; }
    header h1 { font-size: 2.6rem; font-weight: 800; background: linear-gradient(135deg, #a5b4fc, #6366f1, #c084fc); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 8px; }
    header p { color: var(--text-muted); font-size: 1.1rem; }

    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 18px; margin-bottom: 35px; }
    .stat-card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 14px; padding: 20px; text-align: center; transition: transform 0.2s, border-color 0.2s; }
    .stat-card:hover { transform: translateY(-3px); border-color: var(--primary); }
    .stat-val { font-size: 2rem; font-weight: 800; color: var(--primary); margin: 6px 0; }
    .stat-label { font-size: 0.85rem; color: var(--text-muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }

    .section-title { font-size: 1.5rem; font-weight: 700; margin-bottom: 20px; display: flex; align-items: center; justify-content: space-between; }
    
    .movies-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 22px; margin-bottom: 40px; }
    .movie-card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 16px; padding: 22px; display: flex; flex-direction: column; justify-content: space-between; transition: all 0.2s; }
    .movie-card:hover { border-color: #3b82f6; box-shadow: 0 10px 25px -5px rgba(99, 102, 241, 0.15); }
    .movie-badge { display: inline-block; font-size: 0.75rem; font-weight: 700; background: rgba(99, 102, 241, 0.15); color: #818cf8; padding: 4px 10px; border-radius: 9999px; margin-bottom: 12px; }
    .movie-title { font-size: 1.25rem; font-weight: 700; margin-bottom: 8px; color: #fff; }
    .rating-box { display: flex; align-items: center; gap: 6px; font-weight: 700; font-size: 1.1rem; color: var(--accent); margin-bottom: 15px; }
    .btn-details { background: #1e293b; color: #fff; border: 1px solid #334155; padding: 8px 16px; border-radius: 8px; font-weight: 600; cursor: pointer; transition: 0.2s; width: 100%; text-align: center; }
    .btn-details:hover { background: var(--primary); border-color: var(--primary); }

    .action-panel { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 16px; padding: 25px; margin-bottom: 40px; }
    .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)) 140px; gap: 15px; align-items: end; margin-top: 15px; }
    .form-group label { display: block; font-size: 0.85rem; font-weight: 600; color: var(--text-muted); margin-bottom: 6px; }
    .form-group select, .form-group input { width: 100%; padding: 10px 14px; background: #0b0f19; border: 1px solid #334155; border-radius: 8px; color: #fff; font-size: 0.95rem; }
    .btn-submit { background: var(--primary); color: #fff; border: none; padding: 11px 20px; border-radius: 8px; font-weight: 700; cursor: pointer; transition: 0.2s; width: 100%; }
    .btn-submit:hover { background: var(--primary-hover); }

    /* Modal */
    .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.75); align-items: center; justify-content: center; z-index: 100; padding: 20px; }
    .modal.open { display: flex; }
    .modal-box { background: #131b2e; border: 1px solid #334155; border-radius: 18px; max-width: 550px; width: 100%; padding: 28px; position: relative; }
    .modal-close { position: absolute; top: 18px; right: 20px; font-size: 1.5rem; color: var(--text-muted); cursor: pointer; }
    .modal-title { font-size: 1.5rem; font-weight: 800; margin-bottom: 15px; }
    .meta-list { margin: 12px 0 20px 0; font-size: 0.95rem; line-height: 1.7; color: #cbd5e1; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>🎬 Movie Review System</h1>
      <p>Interactive Live Dashboard & Backend REST Engine</p>
    </header>

    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-label">Total Movies</div>
        <div class="stat-val" id="stat-movies">-</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Registered Users</div>
        <div class="stat-val" id="stat-users">-</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Total Ratings</div>
        <div class="stat-val" id="stat-ratings">-</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Top Reviewer</div>
        <div class="stat-val" id="stat-topuser" style="font-size: 1.4rem;">-</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Most Rated Movie</div>
        <div class="stat-val" id="stat-mostrated" style="font-size: 1.4rem;">-</div>
      </div>
    </div>

    <div class="action-panel">
      <h3 style="font-size: 1.2rem; font-weight: 700;">✍️ Submit a Movie Rating</h3>
      <form id="rating-form" class="form-grid">
        <div class="form-group">
          <label>Select User</label>
          <select id="user-select" required></select>
        </div>
        <div class="form-group">
          <label>Select Movie</label>
          <select id="movie-select" required></select>
        </div>
        <div class="form-group">
          <label>Score (1 to 5 Stars)</label>
          <select id="rating-score">
            <option value="5">⭐⭐⭐⭐⭐ (5/5)</option>
            <option value="4">⭐⭐⭐⭐ (4/5)</option>
            <option value="3">⭐⭐⭐ (3/5)</option>
            <option value="2">⭐⭐ (2/5)</option>
            <option value="1">⭐ (1/5)</option>
          </select>
        </div>
        <button type="submit" class="btn-submit">Submit</button>
      </form>
    </div>

    <div class="section-title">
      <h2>🎥 Movies Catalog</h2>
    </div>

    <div class="movies-grid" id="movies-container"></div>
  </div>

  <div class="modal" id="movie-modal">
    <div class="modal-box">
      <span class="modal-close" onclick="closeModal()">&times;</span>
      <div class="modal-title" id="modal-title">-</div>
      <p id="modal-genre" style="color: #818cf8; font-weight: 600; margin-bottom: 12px;"></p>
      <div id="modal-content"></div>
    </div>
  </div>

  <script>
    let allMovies = [];
    let allUsers = [];

    async function loadData() {
      try {
        const [statsRes, moviesRes, usersRes] = await Promise.all([
          fetch('/api/stats'),
          fetch('/api/movies'),
          fetch('/api/users')
        ]);

        const stats = await statsRes.json();
        allMovies = await moviesRes.json();
        allUsers = await usersRes.json();

        document.getElementById('stat-movies').textContent = stats.totalMovies;
        document.getElementById('stat-users').textContent = stats.totalUsers;
        document.getElementById('stat-ratings').textContent = stats.totalRatings;
        document.getElementById('stat-topuser').textContent = stats.topUser.name + ' (' + stats.topUser.count + ')';
        document.getElementById('stat-mostrated').textContent = stats.mostRatedMovie.name;

        renderMovies(allMovies);
        populateSelects();
      } catch (err) {
        console.error('Error loading data:', err);
      }
    }

    function renderMovies(movies) {
      const container = document.getElementById('movies-container');
      container.innerHTML = '';
      movies.forEach(m => {
        const card = document.createElement('div');
        card.className = 'movie-card';
        card.innerHTML = `
          <div>
            <span class="movie-badge">${m.genre}</span>
            <h3 class="movie-title">${m.name}</h3>
            <div class="rating-box">
              <span>★</span>
              <span>${m.averageRating > 0 ? m.averageRating + ' / 5.0' : 'Unrated'}</span>
            </div>
          </div>
          <button class="btn-details" onclick="openDetails(${m.id})">View Cast & Details</button>
        `;
        container.appendChild(card);
      });
    }

    function populateSelects() {
      const uSelect = document.getElementById('user-select');
      const mSelect = document.getElementById('movie-select');
      uSelect.innerHTML = allUsers.map(u => `<option value="${u.id}">${u.name} (Age: ${u.age})</option>`).join('');
      mSelect.innerHTML = allMovies.map(m => `<option value="${m.id}">${m.name}</option>`).join('');
    }

    function openDetails(movieId) {
      const movie = allMovies.find(m => m.id === movieId);
      if (!movie) return;

      document.getElementById('modal-title').textContent = movie.name;
      document.getElementById('modal-genre').textContent = 'Genre: ' + movie.genre;

      let html = '<h4 style="color: #fff; margin-top: 10px;">🎭 Cast Members:</h4><ul class="meta-list">';
      if (movie.cast && movie.cast.length > 0) {
        movie.cast.forEach(c => {
          html += `<li><strong>${c.name}</strong> as <em>"${c.character}"</em> (${c.role})</li>`;
        });
      } else {
        html += '<li>No cast information available.</li>';
      }
      html += '</ul>';

      html += '<h4 style="color: #fff; margin-top: 10px;">🎬 Crew Members:</h4><ul class="meta-list">';
      if (movie.crew && movie.crew.length > 0) {
        movie.crew.forEach(cr => {
          html += `<li><strong>${cr.name}</strong> — ${cr.role}</li>`;
        });
      } else {
        html += '<li>No crew information available.</li>';
      }
      html += '</ul>';

      document.getElementById('modal-content').innerHTML = html;
      document.getElementById('movie-modal').classList.add('open');
    }

    function closeModal() {
      document.getElementById('movie-modal').classList.remove('open');
    }

    document.getElementById('rating-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const userId = parseInt(document.getElementById('user-select').value);
      const movieId = parseInt(document.getElementById('movie-select').value);
      const rating = parseInt(document.getElementById('rating-score').value);

      try {
        const res = await fetch('/api/add-rating', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ userId, movieId, rating })
        });
        const result = await res.json();
        alert(result.message);
        if (result.success) loadData();
      } catch (err) {
        alert('Failed to submit rating');
      }
    });

    window.onclick = function(e) {
      const modal = document.getElementById('movie-modal');
      if (e.target === modal) closeModal();
    }

    loadData();
  </script>
</body>
</html>
